# Dependency updates, respecting ADR 0003: no release younger than 14 days.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint 8.x supports TypeScript < 6.1. Remove this once it supports TypeScript 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Node's type definitions must match the Node version we run (.nvmrc: 22).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
