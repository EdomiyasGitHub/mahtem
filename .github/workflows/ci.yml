name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every third-party action is pinned to a full commit hash (the tag is in the comment),
# so a moved or hijacked tag cannot change what runs. Versions follow ADR 0003's 14-day rule.

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # npm 10 crashes resolving Vitest's peer graph; the project requires npm 11 (ADR 0003).
      - run: npm install -g npm@11.20.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run verify:dist
      # The browser check page must keep compiling (run it locally with `npm run smoke`).
      - run: npx vite build --config vite.smoke.config.ts
      # Runtime dependencies must be clean; dev tooling advisories are reported but don't block.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=critical || true

  browser:
    # Browser tests against the production build, in Chromium and Firefox.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.20.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    # Only main, only after every check and browser test has passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.20.0
      - run: npm ci
      - run: npm run build
      - run: npm run verify:dist
      - id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.141.0'
          command: deploy
      # Check the LIVE site serves THIS build, with the strict security headers.
      # A new deployment takes a little while to reach Cloudflare's network, so poll
      # (curl --retry does not retry on 404). The build's script file name changes with
      # every build, so finding it proves the new version, not the previous one, is live.
      - name: Verify the live site
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: bash scripts/verify-live.sh "$URL" dist/index.html
