name: Something doesn't work
description: A bug, a wrong verdict, or a confusing explanation
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you click, what did you expect, and what did you see instead?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 131 on Windows 11
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Anything in the browser console? (F12, Console tab)
      render: text
  - type: markdown
    attributes:
      value: Never paste private keys. The lab never needs them to diagnose a problem.
